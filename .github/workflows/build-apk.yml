name: Build PulseForge APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o PulseForge-X-Mobile-PCStyle-V55.zip -d extracted

      - name: Restore signing key
        run: |
          mkdir -p signing-key
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > signing-key/pulseforge-release.jks


      - name: Build APK
        working-directory: extracted/PulseForge-X-Mobile
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          gradle assembleDebug

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          UNSIGNED_APK=$(find extracted -type f -name "*.apk" | head -n 1)
          test -n "$UNSIGNED_APK"

          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -n "$BUILD_TOOLS"

          mkdir -p apk-output

          "$BUILD_TOOLS/zipalign" -f -p 4 \
            "$UNSIGNED_APK" \
            apk-output/PulseForge-X-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks signing-key/pulseforge-release.jks \
            --ks-key-alias pulseforge \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out apk-output/PulseForge-X.apk \
            apk-output/PulseForge-X-aligned.apk

          "$BUILD_TOOLS/apksigner" verify --verbose \
            apk-output/PulseForge-X.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseForge-X-Signed-APK
          path: apk-output/PulseForge-X.apk
