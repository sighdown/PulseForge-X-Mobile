name: Build PulseForge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir -p extracted
          unzip -o PulseForge-X-Mobile-V54-NotificationFix.zip -d extracted

      - name: Build Android APK
        working-directory: extracted/PulseForge-X-Mobile
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          gradle assembleDebug

      - name: Collect APK
        run: |
          mkdir -p apk-output
          cp extracted/PulseForge-X-Mobile/app/build/outputs/apk/debug/app-debug.apk apk-output/PulseForge-X.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: PulseForge-X-APK
          path: apk-output/PulseForge-X.apk
