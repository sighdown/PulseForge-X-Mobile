name: Build PulseForge APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project
        run: |
          mkdir -p extracted
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          test -n "$ZIP"
          unzip -o "$ZIP" -d extracted

      - name: Build Android APK
        run: |
         echo "android.useAndroidX=true" > extracted/PulseForge-X-Mobile/gradle.properties
          PROJECT=$(find extracted -type f -name "settings.gradle" -printf '%h\n' | head -n 1)
          test -n "$PROJECT"
          cd "$PROJECT"
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Collect APK
        run: |
          mkdir -p apk-output
          APK=$(find extracted -type f -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" apk-output/PulseForge-X.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseForge-X-APK
          path: apk-output/PulseForge-X.apk
