name: Build BTC Margin Widget v5 1x1 APK

on:
  push:
    branches:
      - build-btc-margin-widget-v3-20261115
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Rebuild source ZIP
        run: |
          cat tmp-btc-margin-widget-v3/source.part1 \
              tmp-btc-margin-widget-v3/source.part2 \
              tmp-btc-margin-widget-v3/source.part3 \
              tmp-btc-margin-widget-v3/source.part4 \
            | base64 --decode > /tmp/MarginBalanceWidget_v3_source.zip
          mkdir -p extracted
          unzip -q /tmp/MarginBalanceWidget_v3_source.zip -d extracted

      - name: Build release APK
        working-directory: extracted/MarginBalanceWidget
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' app/build.gradle.kts
          sed -i 's/versionCode = 3/versionCode = 5/' app/build.gradle.kts
          sed -i 's/versionName = "3.0"/versionName = "5.0"/' app/build.gradle.kts
          sed -i '/kotlin("android")/d' build.gradle.kts app/build.gradle.kts
          sed -i 's/android:minWidth="110dp"/android:minWidth="40dp"/' app/src/main/res/xml/margin_widget_info.xml
          sed -i 's/android:minResizeWidth="110dp"/android:minResizeWidth="40dp"/' app/src/main/res/xml/margin_widget_info.xml
          sed -i 's/android:targetCellWidth="2"/android:targetCellWidth="1"/' app/src/main/res/xml/margin_widget_info.xml
          sed -i 's/android:paddingHorizontal="4dp"/android:paddingHorizontal="2dp"/' app/src/main/res/layout/widget_margin.xml
          sed -i 's/android:textSize="24sp"/android:textSize="20sp"/g' app/src/main/res/layout/widget_margin.xml
          cp "$GITHUB_WORKSPACE/tmp-btc-margin-widget-v3/RealtimeUpdateService.kt" app/src/main/java/com/lactoone/marginwidget/RealtimeUpdateService.kt
          sed -i 's/화면 켜짐: BTC 실시간 · Margin Balance 2초 · 화면 꺼짐: 5분/화면 켜짐: BTC · Margin Balance 모두 1초 · 화면 꺼짐: 5분/' app/src/main/java/com/lactoone/marginwidget/SettingsActivity.kt
          sed -i 's/홈 화면 2×1/홈 화면 1×1/g' app/src/main/java/com/lactoone/marginwidget/SettingsActivity.kt
          gradle :app:assembleRelease

      - name: Restore signing key
        run: |
          mkdir -p signing-key
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 --decode > signing-key/pulseforge-release.jks

      - name: Sign APK
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          UNSIGNED_APK=$(find extracted/MarginBalanceWidget/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          test -n "$UNSIGNED_APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -n "$BUILD_TOOLS"
          mkdir -p apk-output
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" apk-output/BTC-Margin-Widget-v5-1x1-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks signing-key/pulseforge-release.jks \
            --ks-key-alias pulseforge \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out apk-output/BTC-Margin-Widget-v5-1x1.apk \
            apk-output/BTC-Margin-Widget-v5-1x1-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose apk-output/BTC-Margin-Widget-v5-1x1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BTC-Margin-Widget-v5-1x1-Signed-APK
          path: apk-output/BTC-Margin-Widget-v5-1x1.apk
