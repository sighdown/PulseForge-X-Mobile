name: Create PulseForge Signing Key

on:
  workflow_dispatch:

jobs:
  create-key:
    runs-on: ubuntu-latest

    steps:
      - name: Create signing keystore
        env:
          STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -keystore pulseforge-release.jks \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias pulseforge \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=PulseForge X, OU=Mobile, O=PulseForge, C=KR"

      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: pulseforge-signing-key
          path: pulseforge-release.jks
          retention-days: 1
